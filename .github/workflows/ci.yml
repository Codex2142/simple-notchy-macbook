name: Project Island CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Rust & macOS Swift Verification (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace unit & integration tests
        run: cargo test --workspace

      - name: Run Cargo Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Generate UniFFI Swift bindings
        run: ./scripts/build-rust-macos.sh

      - name: Build ProjectIslandApp & run Swift + UniFFI self-test suite
        run: ./scripts/test-macos.sh
